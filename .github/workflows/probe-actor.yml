name: Probe Apify actor

on:
  workflow_dispatch:
    inputs:
      actor:
        description: 'Actor id, e.g. mu0i~tiktok-trending'
        required: true
      input:
        description: 'Actor input JSON'
        required: true
        default: '{}'
      max_items:
        description: 'Max dataset items to request'
        default: '5'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run actor and print summary
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ACTOR: ${{ inputs.actor }}
          INPUT: ${{ inputs.input }}
          MAX_ITEMS: ${{ inputs.max_items }}
        run: |
          node --input-type=module -e '
          const H={Authorization:`Bearer ${process.env.APIFY_TOKEN}`,"Content-Type":"application/json"};
          const api=async(p,o={})=>{const r=await fetch("https://api.apify.com"+p,{...o,headers:H});const t=await r.text();if(!r.ok)throw new Error(r.status+" "+t.slice(0,300));return JSON.parse(t)};
          const lim=(await api("/v2/users/me/limits")).data;
          console.log("usage before:",lim.current.monthlyUsageUsd,"/",lim.limits.maxMonthlyUsageUsd);
          if(lim.current.monthlyUsageUsd>lim.limits.maxMonthlyUsageUsd*0.8){console.log("budget guard: skip");process.exit(0)}
          const max=Math.min(Number(process.env.MAX_ITEMS)||5,50);
          const run=(await api(`/v2/acts/${process.env.ACTOR}/runs?waitForFinish=240&maxItems=${max}`,{method:"POST",body:process.env.INPUT})).data;
          let r=run;for(let i=0;i<30&&!["SUCCEEDED","FAILED","ABORTED","TIMED-OUT"].includes(r.status);i++){await new Promise(s=>setTimeout(s,8000));r=(await api(`/v2/actor-runs/${run.id}`)).data}
          console.log("status:",r.status,r.statusMessage||"");
          const items=await api(`/v2/datasets/${r.defaultDatasetId}/items?clean=true&limit=${max}`);
          console.log("items:",items.length);
          if(items[0]){console.log("keys:",Object.keys(items[0]).join(","));items.slice(0,3).forEach((x,i)=>console.log("item"+i+":",JSON.stringify(x).slice(0,700)))}
          const log=await (await fetch(`https://api.apify.com/v2/logs/${run.id}`,{headers:H})).text();
          console.log("--- log tail ---\n"+log.trim().split("\n").slice(-12).join("\n"));
          const after=(await api("/v2/users/me/limits")).data;console.log("usage after:",after.current.monthlyUsageUsd);
          '
