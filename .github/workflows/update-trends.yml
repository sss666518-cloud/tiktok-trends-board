name: Update TikTok trends

on:
  schedule:
    - cron: '0 14 * * *'   # daily 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-trends
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch trends
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          COUNTRY: US
          LIMIT: '20'
        run: node scripts/fetch-trends.mjs
      - name: Commit data
        run: |
          git config user.name "trends-bot"
          git config user.email "trends-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update trends $(date -u +%F)"
          git push
