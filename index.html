<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src http: https:; img-src data: blob:; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>Content Command Center</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--sub:#fafbfc;--ink:#15181c;--ink2:#3f4750;--muted:#65707c;--line:#dfe3e8;--line2:#edf0f3;
  --accent:#2350c8;--accent-ink:#fff;--accent-soft:#e9effd;
  --ok:#0f6f40;--ok-soft:#e5f3eb;--warn:#8a5200;--warn-soft:#fdf2dc;--err:#b3261e;--err-soft:#fdeceb;
  --demo:#5b43a8;--demo-soft:#efebfa;--info:#1b5d86;--info-soft:#e6f1f8;
  --r:6px;--side:208px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
h1{font-size:18px;font-weight:650}
h2{font-size:14px;font-weight:650}
h3{font-size:13px;font-weight:650}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.muted{color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--sub);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:14px}
.brand{padding:2px 8px}
.brand b{display:block;font-size:13px;letter-spacing:.2px}
.brand span{font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:7px 8px;border-radius:5px;cursor:pointer;text-align:left;color:var(--ink2);white-space:nowrap}
.nav button:hover{background:var(--line2)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .k{font-size:11px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;font-size:11px;color:var(--muted);padding:0 8px;line-height:1.5}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px 16px;padding:8px 20px;min-height:50px;flex-wrap:wrap}
.tb-ws{display:flex;align-items:center;gap:6px;min-width:0}
.tb-ws .ws{color:var(--muted)}
.tb-src{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;color:var(--ink2);font-size:12px;min-width:0;margin-left:auto}
.tb-src .nm{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--ink)}
.tb-actions{display:flex;gap:6px}
main{padding:16px 20px 48px;min-width:0}
main:focus{outline:none}
.page-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.page-head .muted{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover:not(:disabled){background:var(--line2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){background:#1c43aa}
.btn.danger{color:var(--err)}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.btn:disabled{opacity:.55;cursor:not-allowed}
label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn{width:28px;height:28px;display:inline-grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:5px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--line2)}
.icon-btn[aria-pressed="true"]{color:#b7791f}
.icon-btn svg{width:16px;height:16px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font-size:11px;font-weight:600;color:var(--ink2)}
input[type=text],input[type=search],input[type=url],input[type=number],input[type=date],input[type=time],select,textarea{height:30px;border:1px solid var(--line);border-radius:5px;background:#fff;padding:0 8px;min-width:0;max-width:100%}
textarea{height:auto;padding:6px 8px;resize:vertical;line-height:1.55;width:100%}
select{padding-right:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:8px}
.toolbar .grow{flex:1 1 220px}
.toolbar .grow input,.toolbar .grow select{width:100%}
.resultbar{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:6px 0 8px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);max-width:100%}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top;white-space:nowrap}
thead th{background:var(--sub);font-size:11px;font-weight:650;color:var(--ink2)}
tbody tr:last-child>*{border-bottom:0}
tbody tr:hover{background:#fafbfd}
th.num,td.num{text-align:right}
.c-title{white-space:normal;min-width:220px;max-width:360px;font-weight:400}
.t-title{font-weight:600;color:var(--ink);word-break:break-word}
.t-sub{color:var(--muted);font-size:12px;margin-top:2px;word-break:break-word}
.sort-btn{border:0;background:transparent;padding:0;font:inherit;font-weight:650;color:inherit;cursor:pointer;display:inline-flex;gap:3px;align-items:center}
.sort-btn[data-active="true"]{color:var(--accent)}
.int{font-size:10px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 3px;margin-left:3px}
.badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:600;background:var(--line2);color:var(--ink2);line-height:1.6;white-space:nowrap}
.ds-Live{background:var(--ok-soft);color:var(--ok)}
.ds-Imported{background:var(--info-soft);color:var(--info)}
.ds-Demo{background:var(--demo-soft);color:var(--demo)}
.ds-Stale{background:var(--warn-soft);color:var(--warn)}
.ds-Error{background:var(--err-soft);color:var(--err)}
.st-Breakout{background:#fde8e1;color:#a2341a}
.st-Rising{background:var(--ok-soft);color:var(--ok)}
.st-New{background:var(--info-soft);color:var(--info)}
.st-Cooling{background:#eef0f3;color:#5a6470}
.cat-Traffic{background:#fdf0e3;color:#8a4a0b}
.cat-Brand{background:#eceafa;color:#4b3d9a}
.cat-Bridge{background:#e4f2f1;color:#1d6660}
.up{color:var(--ok)}.down{color:var(--err)}
.banner{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:8px 12px;border-radius:var(--r);border:1px solid var(--line);background:#fff;margin-bottom:8px;font-size:12px}
.banner .b-text{flex:1 1 320px;min-width:0;word-break:break-word}
.banner .b-actions{display:flex;gap:6px;flex-wrap:wrap}
.banner.demo{background:var(--demo-soft);border-color:#dcd3f3}
.banner.err{background:var(--err-soft);border-color:#f3c9c5}
.banner.warn{background:var(--warn-soft);border-color:#f1dcb0}
.banner.load{background:var(--accent-soft);border-color:#cdd9f6}
.empty{padding:36px 16px;text-align:center;color:var(--ink2);white-space:normal}
.empty h2{margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:12px}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.panel+.panel{margin-top:12px}
.grid2>.panel+.panel{margin-top:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink2);align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fields{display:grid;gap:10px}
.fields .fld>span{display:flex;justify-content:space-between;gap:8px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{height:30px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:15px;cursor:pointer;font-size:12px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.seg button{border:0;border-right:1px solid var(--line);background:#fff;padding:8px 10px;text-align:left;cursor:pointer;min-width:0}
.seg button:last-child{border-right:0}
.seg button b{display:block;font-size:13px}
.seg button small{display:block;color:var(--muted);font-size:11px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
.seg button[aria-pressed="true"] b{color:var(--accent)}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.pcard header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;border-bottom:1px solid var(--line2);padding-bottom:8px}
.pcard dl{margin:0;display:grid;gap:7px}
.pcard dt{font-size:11px;font-weight:650;color:var(--muted)}
.pcard dd{margin:0;word-break:break-word}
.pcard .hook{font-weight:600}
.mlist{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.mlist li{display:flex;gap:8px}
.mlist code{font:600 11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--line2);border-radius:3px;padding:0 5px;color:var(--ink2);white-space:nowrap}
.plan-preview{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
tr.done td,tr.done th{color:var(--muted)}
tr.done .t-title{text-decoration:line-through}
.score-in{width:62px;text-align:right}
.adj{font-size:10px;color:var(--warn);font-weight:650;margin-left:4px}
.save-state{font-size:11px;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:8px;padding:0;color:var(--ink);background:#fff;box-shadow:0 12px 40px rgba(10,20,30,.18)}
dialog::backdrop{background:rgba(15,20,25,.35)}
dialog.drawer{margin:0 0 0 auto;height:100%;max-height:100%;width:min(560px,100vw);max-width:100vw;border-radius:0;border:0;border-left:1px solid var(--line)}
.drawer-in{display:flex;flex-direction:column;height:100%}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff}
.drawer-body{padding:12px 16px 32px;overflow-y:auto;display:grid;gap:14px;align-content:start;flex:1}
.drawer-body section{border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.drawer-body section>h3{margin-bottom:8px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 10px;margin:0;font-size:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row .fld{flex:1 1 140px}
.errlist{margin:6px 0 0;padding-left:18px;max-height:160px;overflow:auto;font-size:12px}
.note{font-size:12px;color:var(--muted)}
.result{margin-top:8px;padding:8px 10px;border-radius:5px;font-size:12px;word-break:break-word}
.result.ok{background:var(--ok-soft);color:var(--ok)}
.result.err{background:var(--err-soft);color:var(--err)}
.result.warn{background:var(--warn-soft);color:var(--warn)}
dialog.confirm{width:min(440px,calc(100vw - 32px))}
.confirm-in{padding:16px}
.confirm-in p{margin:8px 0 14px;color:var(--ink2);white-space:pre-line;word-break:break-word}
.confirm-in .row{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;display:flex;gap:10px;align-items:center;width:max-content;max-width:calc(100vw - 32px);background:#1d2127;color:#fff;padding:8px 12px;border-radius:6px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast[hidden]{display:none}
.toast.err{background:#8f1d17}
.toast button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:4px;padding:2px 8px;cursor:pointer;flex:none}
.watermark{border-left:3px solid var(--err)}
@media (max-width:1180px){.grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:6px 12px;gap:10px;min-width:0}
  .brand span,.side-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;min-width:0;flex:1}
  .nav button{width:auto}
  .nav .k{margin-left:2px}
  .topbar{position:static;padding:8px 12px}
  .tb-src{margin-left:0;width:100%;order:3}
  .tb-actions{margin-left:auto}
  main{padding:12px 12px 48px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .seg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seg button:nth-child(2){border-right:0}
  .seg button:nth-child(-n+2){border-bottom:1px solid var(--line)}
}
@media (max-width:480px){
  .brand{display:none}
  .toolbar .fld{flex:1 1 calc(50% - 8px)}
  .toolbar .fld select{width:100%}
  .kv{grid-template-columns:96px minmax(0,1fr)}
}
@media (pointer:coarse){.btn{min-height:36px}.btn.sm{min-height:32px}.icon-btn{width:36px;height:36px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="主导航">
    <div class="brand"><b>Content Command Center</b><span>Content Intelligence System</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="content">
    <header class="topbar" id="topbar"></header>
    <main id="main" tabindex="-1"><div class="empty"><h2>正在加载…</h2><p>如果一直停留在这里，说明当前环境没有执行 JavaScript（例如编辑器或应用内的本地文件预览）。请用 Chrome、Safari 或 Edge 直接打开此文件。</p></div></main>
  </div>
</div>
<dialog class="drawer" id="drawer" aria-labelledby="drawerTitle"><div class="drawer-in" id="drawerIn"></div></dialog>
<dialog class="confirm" id="confirm" aria-labelledby="cfTitle">
  <div class="confirm-in">
    <h2 id="cfTitle"></h2>
    <p id="cfMsg"></p>
    <div class="row"><button type="button" class="btn" id="cfCancel">取消</button><button type="button" class="btn primary" id="cfOk">确认</button></div>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastMsg"></span><button type="button" id="toastAct" hidden></button></div>
<script>
'use strict';
(function(){
const TYPES=['Music','Hashtag','Format','Topic','Template'];
const CATS=['Traffic','Brand','Bridge'];
const STATUSES=['New','Rising','Breakout','Stable','Cooling'];
const MODES=['Mirror','Adapt','Companion','Sequence'];
const PLATFORMS=['TikTok','Personal Instagram','Company Instagram'];
const AUTO_URL=/^https?:$/.test(location.protocol)?new URL('data/trends.json',location.href).href:'';
const PAGES=[['radar','Radar'],['forme','For Me'],['ideas','Ideas'],['reuse','Reuse Engine'],['calendar','Calendar'],['saved','Saved']];
const K='cis.v2.';
const STALE_CAPTURE_DAYS=7,STALE_API_HOURS=36,FETCH_TIMEOUT=15000,MAX_FILE=5*1024*1024;
const TZS=['Asia/Shanghai','Asia/Hong_Kong','Asia/Taipei','Asia/Singapore','Asia/Tokyo','Europe/London','Europe/Berlin','America/New_York','America/Chicago','America/Los_Angeles','UTC'];
const DEFAULT_TIMES={'TikTok':'19:00','Personal Instagram':'12:30','Company Instagram':'10:00'};
const SHORT={'TikTok':'TikTok','Personal Instagram':'个人 IG','Company Instagram':'公司 IG'};

const DEMO_RAW=[
{id:'demo-001',title:'Things I thought would make it easier',type:'Format',category:'Bridge',region:'US',language:'EN',status:'Rising',growth:38,volume:24500,viral:92,fit:97,reuse:95,hook:'Things I thought would make building an app alone easier.',angle:'以为 AI 能替我搞定一切，结果我成了全职 bug 侦探。',shots:['对镜头展示「三天就能上线」的计划','录屏：生成的代码与真实报错','回到镜头：一个实际解决问题的瞬间']},
{id:'demo-002',title:'I built it. Nobody asked for it.',type:'Topic',category:'Brand',region:'US',language:'EN',status:'Stable',growth:6,volume:8900,viral:80,fit:99,reuse:96,hook:'I spent 3 days building a feature nobody wanted.',angle:'一次产品减法：删掉一个自我感动的功能，以及用户反馈怎么改变了优先级。',shots:['被移除的功能界面','用户反馈截图（隐藏个人信息）','简化后的产品流程']},
{id:'demo-003',title:'Quiet build → big reveal',type:'Music',category:'Bridge',region:'GB',language:'EN',status:'New',growth:21,volume:5200,viral:86,fit:86,reuse:89,hook:'A quiet weekend. A working product.',angle:'用一个周末的开发片段，按节拍剪出从空白到可用的过程。',shots:['桌面与空白编辑器','三段开发过程录屏','节奏转折点：产品运行画面']},
{id:'demo-004',title:'#BuildInPublic',type:'Hashtag',category:'Brand',region:'Global',language:'EN',status:'Stable',growth:3,volume:61000,viral:73,fit:98,reuse:92,hook:'Day 12 of building my own app: the first real user.',angle:'第一位真实用户的反馈，以及你因此改掉的一个设计。',shots:['本周产品画面','匿名化反馈摘录','下一步改进的草图']},
{id:'demo-005',title:'The 3-tab founder',type:'Template',category:'Bridge',region:'US',language:'EN',status:'Rising',growth:29,volume:12300,viral:85,fit:93,reuse:97,hook:'My startup has 3 departments. They’re all me.',angle:'开发、设计、客服三个身份分屏切换，最后落到同一个产品。',shots:['左屏：代码编辑器','中屏：设计稿','右屏：匿名客服回复']},
{id:'demo-006',title:'POV: just one tiny change',type:'Format',category:'Traffic',region:'US',language:'EN',status:'Breakout',growth:64,volume:31800,viral:95,fit:77,reuse:83,hook:'POV: you said “just one tiny change.”',angle:'一个按钮改色，最后重做半个界面；结尾给出划定迭代边界的规则。',shots:['轻松说出「就改一点」','快切多个修改画面','改动清单与你的表情']},
{id:'demo-007',title:'Honest desk setup',type:'Format',category:'Traffic',region:'CN',language:'ZH',status:'Cooling',growth:-12,volume:40200,viral:78,fit:61,reuse:70,hook:'我的桌面没有氛围灯，只有一个还没修完的 bug。',angle:'反向桌面展示：用真实工作环境代替设备炫耀，镜头落到正在做的产品。',shots:['全景：未整理的真实桌面','显示器特写：待处理 issue 列表','手机上打开自己的 App']},
{id:'demo-008',title:'一人公司的一周时间分配',type:'Topic',category:'Brand',region:'CN',language:'ZH',status:'New',growth:17,volume:3600,viral:68,fit:95,reuse:88,hook:'一个人做 App，最花时间的不是写代码。',angle:'拆解一周真实时间：开发、客服、设计、上架审核各占多少小时。',shots:['时间记录截图','四个角色各 2 秒的工作画面','结论与产品画面']}
];

/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
class Raw{constructor(s){this.s=s}}
const raw=s=>new Raw(s);
const fmtv=v=>v==null||v===false?'':v instanceof Raw?v.s:Array.isArray(v)?v.map(fmtv).join(''):esc(v);

const ALIAS={captured_at:'captured',capturedat:'captured',captured_time:'captured',link:'url',original_url:'url',viral_potential:'viral',ip_fit:'fit',reuse_leverage:'reuse',lang:'language'};
function normKeys(o){const r={};for(const k of Object.keys(o)){const lk=k.trim().toLowerCase().replace(/[\s-]+/g,'_');const kk=ALIAS[lk]||lk;if(!(kk in r))r[kk]=o[k]}return r}

function pickEnum(v,list,def,warn,name){if(v==null||v==='')return def;const s=String(v).trim().toLowerCase();const hit=list.find(x=>x.toLowerCase()===s);if(!hit){warn(`${name}「${String(v).slice(0,30)}」不在可选值内，已设为 ${def}`);return def}return hit}
function toNum(v,def,warn,name,min,max){let n=NaN;if(v==null||v==='')return def;
  if(typeof v==='number')n=v;
  else if(typeof v==='string'){const s=v.trim().replace(/[,\s%+]/g,'');const m=s.match(/^(-?\d+(?:\.\d+)?)([kKmMwW万])?$/);if(m){n=parseFloat(m[1]);if(m[2])n*={k:1e3,K:1e3,m:1e6,M:1e6,w:1e4,W:1e4,'万':1e4}[m[2]]}}

function normalizeItem(rec,ctx){
  const warnings=[];const warn=m=>warnings.push(`${ctx.pos}：${m}`);
  if(!isObj(rec))return {error:`${ctx.pos}：记录不是对象`};
  const r=normKeys(rec);

  if(!title)return {error:`${ctx.pos}：缺少必填字段 title`};
  let shots=r.shots;
  if(typeof shots==='string')shots=shots.split('|');

    id:str(r.id,120),title,
    type:pickEnum(r.type,TYPES,'Topic',warn,'type'),
    category:pickEnum(r.category,CATS,'Bridge',warn,'category'),
    region:str(r.region,40)||d.region||'Unknown',
    language:str(r.language,20)||d.language||'Unknown',
    status:pickEnum(r.status,STATUSES,'New',warn,'status'),

function normalizeAll(records,ctx){
  const items=[],errors=[],warnings=[],ids=new Set();
  records.forEach((rec,i)=>{
    const pos=ctx.posOf(i);
    let r;try{r=normalizeItem(rec,{...ctx,pos})}catch(e){r={error:`${pos}：无法解析`}}
    if(r.error){errors.push(r.error);return}
    const base=r.item.id||('t-'+hash(r.item.title));let id=base,k=2;
    while(ids.has(id))id=`${base}-${k++}`;
    if(id!==base&&r.item.id)r.warnings.push(`${pos}：id「${base}」重复，已改为 ${id}`);
    ids.add(id);r.item.id=id;items.push(r.item);warnings.push(...r.warnings);
  });
  return {items,errors,warnings};
}
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const rows=[];let row=[],field='',q=false,line=1,rowLine=1;
  const endRow=()=>{row.push(field);rows.push({cells:row,line:rowLine});row=[];field=''};
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){field+='"';i++}else q=false}
      else{if(c==='\n')line++;field+=c}
      continue;
    }
    if(c==='"'&&field===''){q=true;continue}
    if(c===','){row.push(field);field='';continue}
    if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;endRow();line++;rowLine=line;continue}
    field+=c;
  }
  if(q)throw new Error(`CSV 第 ${rowLine} 行：引号未闭合`);
  if(field!==''||row.length)endRow();
  return rows.filter(r=>!(r.cells.length===1&&r.cells[0].trim()===''));
}
function csvToRecords(text){
  const rows=parseCSV(text);
  if(!rows.length)throw new Error('CSV 文件为空');
  const head=rows[0].cells.map(h=>h.trim());
  if(!head.some(h=>h.toLowerCase()==='title'))throw new Error('CSV 第 1 行（表头）缺少 title 列');
  const body=rows.slice(1);
  return {records:body.map(r=>{const o={};head.forEach((h,i)=>{if(h)o[h]=r.cells[i]!==undefined?r.cells[i]:''});return o}),lines:body.map(r=>r.line)};
}
function extractRecords(json){
  if(Array.isArray(json))return {records:json,path:''};
  if(isObj(json)&&Array.isArray(json.items))return {records:json.items,path:'items'};
  return null;
}

function captureFocus(){const a=document.activeElement;if(!a||!a.dataset||!a.dataset.fk)return null;let s=null,e=null;try{s=a.selectionStart;e=a.selectionEnd}catch(x){}return {fk:a.dataset.fk,s,e}}
function restoreFocus(f){if(!f)return;const el=document.querySelector(`[data-fk="${CSS.escape(f.fk)}"]`);if(!el||el.disabled)return;el.focus({preventScroll:true});try{if(f.s!=null)el.setSelectionRange(f.s,f.e)}catch(x){}}
function render(){

/* ---------- data source actions ---------- */
function mkErr(kind,message,detail){const e=new Error(message);e.kind=kind;e.detail=detail||'';return e}
function checkEndpoint(ep){
  let u;try{u=new URL(ep)}catch(e){throw mkErr('config','Endpoint 不是有效的 URL','示例：https://your-proxy.example.com/trends')}
  if(u.protocol!=='http:'&&u.protocol!=='https:')throw mkErr('config','Endpoint 只支持 http:// 或 https://');
  if(u.username||u.password)throw mkErr('config','Endpoint 中包含账号或密码','请改为通过自己的后端代理鉴权，不要把凭据写入页面。');
  if([...u.searchParams.keys()].some(k=>/(^|[_-])(api_?key|key|token|secret|password|access_token|auth|signature)$/i.test(k)))throw mkErr('config','Endpoint 的查询参数中疑似包含密钥','请改为通过自己的后端代理鉴权，不要把密钥保存在浏览器中。');
  return u;
}
async function requestEndpoint(ep){
  const u=checkEndpoint(ep);
  if(navigator.onLine===false)throw mkErr('network','网络错误：浏览器当前处于离线状态');
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),FETCH_TIMEOUT);
  let res,text;
  try{
    try{res=await fetch(u.href,{method:'GET',headers:{Accept:'application/json'},cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',signal:ctrl.signal})}
    catch(e){
      if(e&&e.name==='AbortError')throw mkErr('timeout',`请求超时（${FETCH_TIMEOUT/1000} 秒无响应）`);
      throw mkErr('network','网络错误或被浏览器 CORS 策略拦截','浏览器没有拿到响应。常见原因：接口地址无法访问、HTTPS 证书无效，或接口未返回 Access-Control-Allow-Origin（从本地文件打开时请求来源为 null）。浏览器不会向页面透露具体原因，可在开发者工具的 Network / Console 中确认。');
    }
    if(!res.ok)throw mkErr('http',`HTTP ${res.status}${res.statusText?' '+res.statusText:''}`,res.status===401||res.status===403?'接口拒绝访问。需要鉴权的数据源请通过自己的后端代理处理。':res.status===404?'接口地址不存在，请检查 Endpoint。':res.status===429?'请求过于频繁，请稍后再试。':res.status>=500?'接口服务端出错，请稍后重试或检查数据源服务。':'');
    try{text=await res.text()}catch(e){throw mkErr(e&&e.name==='AbortError'?'timeout':'network','读取响应内容失败')}
  }finally{clearTimeout(timer)}
  let json;try{json=JSON.parse(text)}catch(e){throw mkErr('parse','接口返回的内容不是有效 JSON',`HTTP ${res.status}，响应开头：${text.slice(0,80)}`)}
  const ex=extractRecords(json);
  if(!ex)throw mkErr('shape','返回格式不支持','需要是数组 [...] 或 { "items": [...] }。');
  const meta=isObj(json)?json:{};
  return {status:res.status,records:ex.records,path:ex.path,meta};
}
async function testConnection(){
  if(ui.busy)return;
  const d=draft(),ep=d.endpoint.trim();
  if(!ep){ui.testResult={ok:false,text:'请先填写 API Endpoint'};render();return}
  ui.busy='test';ui.testResult=null;render();
  try{
    const r=await requestEndpoint(ep);
    const n=normalizeAll(r.records,{origin:'api',posOf:i=>`第 ${i+1} 条记录（${r.path}[${i}]）`,defaults:{region:d.region.trim(),language:d.language.trim(),source:d.name.trim()||'API'}});
    ui.testResult=!n.items.length&&r.records.length
      ?{ok:false,text:`已连接（HTTP ${r.status}），但 ${r.records.length} 条记录全部未通过校验。`,errors:n.errors}
      :{ok:true,text:`连接成功：HTTP ${r.status}，返回 ${r.records.length} 条记录，${n.items.length} 条有效${n.errors.length?`，${n.errors.length} 条错误`:''}。测试不会替换当前数据。`,errors:n.errors};
  }catch(e){ui.testResult={ok:false,text:'测试失败：'+e.message,detail:e.detail}}
  finally{ui.busy=null;render()}
}
async function refresh(opts={}){
  if(ui.busy)return;
  const s=state.source,ep=(opts.auto?AUTO_URL:(s.endpoint||'')).trim();
  if(!ep){
    toast(s.mode==='imported'?'当前数据来自文件导入。更新请重新导入文件，或在数据源中配置并保存 API Endpoint。':'尚未配置 API Endpoint。请在数据源中填写并保存，或导入文件。');
    if(!$('#drawer').open)openDrawer();return;
  }
  const n0=state.items?state.items.length:0;
  const overwrite=n0&&(s.mode==='imported'||(s.mode==='api'&&s.activeEndpoint&&s.activeEndpoint!==ep));
  if(overwrite&&!opts.auto){
    const ok=await confirmBox('用新的 API 数据替换当前数据？',`当前 ${n0} 条数据来自「${s.activeName}」。\n刷新成功后会被 ${ep} 返回的数据替换；刷新失败则保留现有数据。\n收藏、评分调整、选题编辑和发布计划不受影响。`,'继续刷新');
    if(!ok||ui.busy)return;
  }
  ui.busy='refresh';s.lastAttempt=new Date().toISOString();render();
  try{
    const r=await requestEndpoint(ep);
    const gen=typeof r.meta.generatedAt==='string'&&!isNaN(new Date(r.meta.generatedAt))?new Date(r.meta.generatedAt).toISOString():null;
    const at=gen||new Date().toISOString();
    const jobErr=r.meta.status==='error'&&isObj(r.meta.error)?r.meta.error:null;
    if(jobErr&&!r.records.length)throw mkErr('job','数据更新任务失败：'+String(jobErr.message||'未知错误').slice(0,300),'还没有任何成功抓取的数据。');
    const n=normalizeAll(r.records,{origin:'api',fetchedAt:at,posOf:i=>`第 ${i+1} 条记录（${r.path}[${i}]）`,defaults:{region:s.region,language:s.language,source:s.name||'API'}});
    if(!n.items.length&&r.records.length)throw mkErr('validate',`接口返回 ${r.records.length} 条记录，全部未通过校验`,n.errors.slice(0,3).join('；'));
    state.items=n.items;
    let host='API';try{host=new URL(ep).host}catch(e){}
    Object.assign(s,{mode:'api',activeName:(opts.auto?s.name:'')||s.name||host,activeEndpoint:ep,fileName:'',lastSuccess:at,lastError:jobErr?{message:'数据更新任务失败：'+String(jobErr.message||'未知错误').slice(0,300),detail:`当前显示 ${fmtTime(at)} 抓取的数据。`,kind:'job',at:typeof jobErr.at==='string'?jobErr.at:new Date().toISOString()}:null});
    ui.importErrors=[...n.errors,...n.warnings];
    persist('items','source');
    if(jobErr)toast('今天的数据更新失败，显示的是上一次成功抓取的数据','err');
    else if(!opts.auto)toast(n.items.length?`刷新成功：${n.items.length} 条${n.errors.length?`，跳过 ${n.errors.length} 条无效记录`:''}`:'刷新成功，但接口返回 0 条记录',n.items.length?'':'err');
  }catch(e){
    s.lastError={message:e.message,detail:e.detail||'',kind:e.kind||'unknown',at:new Date().toISOString()};
    persist('source');
    toast('刷新失败：'+e.message+'。已保留上一次成功的数据。','err');
  }finally{ui.busy=null;render()}
}
function saveConfig(){
  const d=draft(),ep=d.endpoint.trim();
  if(ep){try{checkEndpoint(ep)}catch(e){ui.testResult={ok:false,text:'无法保存：'+e.message,detail:e.detail};render();return}}
  Object.assign(state.source,{name:d.name.trim().slice(0,80),endpoint:ep,region:d.region.trim().slice(0,40),language:d.language.trim().slice(0,20)});
  persist('source');ui.testResult={ok:true,text:ep?'配置已保存。点击「手动刷新」请求数据。':'配置已保存（未设置 Endpoint）。'};
  render();toast('数据源配置已保存');
}
async function onFile(input){
  const kind=input.dataset.file,file=input.files&&input.files[0];input.value='';
  if(!file)return;
  const fail=msg=>{ui.pendingImport={fileName:file.name,total:0,items:[],errors:[msg],warnings:[]};render()};
  if(file.size>MAX_FILE)return fail(`文件超过 ${MAX_FILE/1024/1024} MB，请拆分后导入`);
  let text;try{text=await file.text()}catch(e){return fail('无法读取文件')}
  let records,posOf;
  try{
    if(kind==='json'){
      let json;try{json=JSON.parse(text.replace(/^﻿/,''))}catch(e){return fail('不是有效的 JSON：'+e.message)}
      const ex=extractRecords(json);if(!ex)return fail('JSON 顶层需要是数组，或包含 items 数组的对象');
      records=ex.records;posOf=i=>`第 ${i+1} 条记录（${ex.path}[${i}]）`;
    }else{
      const c=csvToRecords(text);records=c.records;posOf=i=>`CSV 第 ${c.lines[i]} 行（第 ${i+1} 条记录）`;
    }
  }catch(e){return fail(e.message)}
  if(!records.length)return fail('文件中没有任何记录');
  const at=new Date().toISOString();
  const n=normalizeAll(records,{origin:'file',fetchedAt:at,posOf,defaults:{region:state.source.region,language:state.source.language,source:state.source.name||file.name}});
  ui.pendingImport={fileName:file.name,kind,total:records.length,items:n.items,errors:n.errors,warnings:n.warnings,at};
  render();
}

function exportCSV(){

  const rows=[['发布日期','时间','时区','平台','趋势','复用模式','Hook','状态','创建时间'],...[...state.plans].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(p=>[p.date,p.time,p.tz,p.platform,p.trendTitle,p.mode,p.hook,p.done?'已完成':'待发布',p.createdAt?fmtTime(p.createdAt):''])];
  const csv='﻿'+rows.map(r=>r.map(cell).join(',')).join('\r\n')+'\r\n';
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=`distribution-plan-${todayIn(browserTz)}.csv`;document.body.appendChild(a);a.click();a.remove();

function updatePlan(id,patch,el){

  if(patch.time!==undefined&&!isTime(patch.time)){el.value=p.time;return toast('请输入有效时间','err')}

  if(state.plans.some(x=>x.id!==id&&planKey(x)===planKey(next))){el.value=patch.date!==undefined?p.date:p.time;return toast('已存在完全相同的计划，未修改','err')}

}

  'reset-filters':()=>{prefs().filters=clone(DEF_PREFS.filters);prefs().sort=clone(DEF_PREFS.sort);savePrefs();render();toast('已重置筛选与排序')},
  'sort-col':el=>{const s=prefs().sort,k=el.dataset.key;if(s.key===k)s.dir=s.dir==='desc'?'asc':'desc';else{s.key=k;s.dir='desc'}savePrefs();render()},
  'sort-dir':()=>{const s=prefs().sort;s.dir=s.dir==='desc'?'asc':'desc';savePrefs();render()},
  'forme-cat':el=>{prefs().forme.cat=el.dataset.cat;savePrefs();render()},
  'reset-score':el=>{delete state.scores[el.dataset.id];persist('scores');render();toast('已恢复原始评分')},
  'reset-idea':async el=>{const id=el.dataset.id;const ok=await confirmBox('恢复生成内容？','这条选题的手动修改会被替换为自动生成的内容（内容备注会保留）。','恢复');if(!ok)return;const memo=(state.ideas[id]||{}).memo;if(memo)state.ideas[id]={memo};else delete state.ideas[id];persist('ideas');render();toast('已恢复生成内容')},
  'set-mode':el=>{prefs().mode=el.dataset.mode;savePrefs();render();toast(`已切换为 ${el.dataset.mode}，三个平台输出已更新`)},
  'add-plans':el=>{
    const t=findTrend(el.dataset.id);if(!t)return toast('找不到该趋势','err');
    const rows=buildPlans(t),keys=new Set(state.plans.map(planKey));let added=0;
    rows.forEach(r=>{const k=planKey(r);if(!keys.has(k)){keys.add(k);state.plans.push(r);added++}});
    if(added)persist('plans');render();
    const skip=rows.length-added;
    toast(added?`已添加 ${added} 条计划${skip?`，${skip} 条与现有计划完全相同已跳过`:''}`:'这 3 条计划已存在，未重复添加',added?'':'err',added?{label:'查看 Calendar',fn:()=>go('calendar')}:null);
  },
  'toggle-done':el=>{const p=state.plans.find(x=>x.id===el.dataset.id);if(!p)return;p.done=!p.done;persist('plans');render();toast(p.done?'已标记完成':'已撤销完成')},
  'delete-plan':el=>{const i=state.plans.findIndex(x=>x.id===el.dataset.id);if(i<0)return;const [rm]=state.plans.splice(i,1);persist('plans');render();
    toast('计划已删除','',{label:'撤销',fn:()=>{if(state.plans.some(x=>planKey(x)===planKey(rm)))return toast('已存在相同计划，无法撤销','err');state.plans.splice(Math.min(i,state.plans.length),0,rm);persist('plans');render();toast('已恢复计划')}})},
  'export-csv':()=>exportCSV(),
  'cal-all':()=>{prefs().calFilter='';savePrefs();render()},
  'saved-reset':()=>{prefs().saved=clone(DEF_PREFS.saved);savePrefs();render()}
};
const C={
  filter:el=>{prefs().filters[el.dataset.key]=el.value;savePrefs();render()},
  'sort-key':el=>{prefs().sort.key=el.value;savePrefs();render()},
  'forme-sort':el=>{prefs().forme.sort=el.value;savePrefs();render()},
  score:el=>{
    const id=el.dataset.id,k=el.dataset.k,it=findTrend(id);if(!it)return;
    const v=Number(el.value);
    if(el.value.trim()===''||!Number.isFinite(v)){el.value=sc(it)[k];return toast('评分需为 0–100 的数字','err')}
    const n=Math.min(100,Math.max(0,Math.round(v)));
    const o={...(state.scores[id]||{})};if(n===it[k])delete o[k];else o[k]=n;
    if(Object.keys(o).length)state.scores[id]=o;else delete state.scores[id];
    persist('scores');render();toast(`${SORT_LABEL[k]} 已更新为 ${n}`);
  },
  'select-trend':el=>{prefs().selected=el.value;savePrefs();render()},
  'plan-start':el=>{if(!isDate(el.value)){el.value=planStart();return toast('请输入有效日期','err')}prefs().plan.start=el.value;savePrefs();render()},
  'plan-tz':el=>{prefs().plan.tz=el.value;savePrefs();render()},
  'plan-cadence':el=>{prefs().plan.cadence=el.value;savePrefs();render()},
  'plan-date':el=>updatePlan(el.dataset.id,{date:el.value},el),
  'plan-time':el=>updatePlan(el.dataset.id,{time:el.value},el),
  'cal-filter':el=>{prefs().calFilter=el.value;savePrefs();render()},
  'saved-f':el=>{prefs().saved[el.dataset.key]=el.value;savePrefs();render()}
};
const I={
  filter:el=>{prefs().filters[el.dataset.key]=el.value;savePrefs();render()},
  'saved-f':el=>{prefs().saved[el.dataset.key]=el.value;savePrefs();render()},
  draft:el=>{draft()[el.dataset.key]=el.value},
  idea:el=>{
    const id=el.dataset.id;state.ideas[id]={...(state.ideas[id]||{}),[el.dataset.field]:el.value.slice(0,20000)};
    const st=$('#ideaSaveState');if(st)st.textContent='正在保存…';
    clearTimeout(ideaTimer);ideaTimer=setTimeout(()=>{persist('ideas');const s2=$('#ideaSaveState');if(s2)s2.textContent=store.ok&&!store.quota?'已保存到本浏览器':'保存失败：仅在本次会话有效'},300);
  }
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el||el.disabled)return;
  const fn=A[el.dataset.action];if(fn){e.preventDefault();fn(el)}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches&&el.matches('input[type=file][data-file]'))return onFile(el);
  const k=el.dataset&&el.dataset.change;if(k&&C[k])C[k](el);
});
document.addEventListener('input',e=>{const el=e.target,k=el.dataset&&el.dataset.input;if(k&&I[k])I[k](el)});
document.addEventListener('submit',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'')&&!$('#drawer').open&&!$('#confirm').open){const s=$('[data-fk="f-q"],[data-fk="sv-q"]');if(s){e.preventDefault();s.focus()}}
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('score-in'))e.target.blur();
});
window.addEventListener('beforeunload',()=>{if(ideaTimer){clearTimeout(ideaTimer);persist('ideas')}});
$('#toastAct').addEventListener('click',()=>{const f=toastFn;$('#toast').hidden=true;toastFn=null;if(f)f()});
$('#cfOk').addEventListener('click',()=>confirmFinish(true));
$('#cfCancel').addEventListener('click',()=>confirmFinish(false));
$('#confirm').addEventListener('cancel',e=>{e.preventDefault();confirmFinish(false)});
$('#drawer').addEventListener('close',()=>{ui.pendingImport=null;ui.testResult=null;const b=$('#topbar [data-action="open-drawer"]');if(b)b.focus()});
$('#drawer').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
window.addEventListener('storage',e=>{if(e.key&&e.key.startsWith(K))toast('其他标签页修改了数据，刷新页面后可看到最新内容')});
window.addEventListener('unhandledrejection',e=>{toast('操作失败：'+((e.reason&&e.reason.message)||'未知错误'),'err')});

render();
if(AUTO_URL){
  if(!state.source.name)state.source.name='TikTok 热门话题';
  refresh({auto:true});
  setInterval(()=>{if(!document.hidden)refresh({auto:true})},30*60*1000);
}
})();
</script>
</body>
</html>
